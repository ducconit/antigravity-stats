<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 96" width="460" height="96">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 8)">
    <rect width="80" height="80" rx="20" fill="url(#logoBgGrad)" stroke="url(#logoBorder)" stroke-width="2.5" filter="url(#softGlow)"/>

    <!-- Mascot Head -->
    <g transform="translate(14, 13)">
      <!-- Antenna -->
      <line x1="26" y1="4" x2="26" y2="13" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="26" cy="4" r="3.5" fill="#38bdf8"/>

      <!-- Ear Bolts -->
      <rect x="3" y="24" width="4" height="11" rx="2" fill="#30363d"/>
      <rect x="45" y="24" width="4" height="11" rx="2" fill="#30363d"/>

      <!-- Head Box -->
      <rect x="7" y="13" width="38" height="31" rx="8" fill="#1c2128" stroke="#38bdf8" stroke-width="2.5"/>

      <!-- Glowing Eyes -->
      <circle cx="19" cy="27" r="3.8" fill="#10b981"/>
      <circle cx="33" cy="27" r="3.8" fill="#10b981"/>

      <!-- Smile -->
      <path d="M 19 35 Q 26 40 33 35" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right Typography -->
  <g transform="translate(106, 20)">
    <!-- Main Title -->
    <text x="0" y="34" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.03em">
      Antigravity Stats
    </text>

    <!-- Version Badge -->
    <g transform="translate(262, 12)">
      <rect width="48" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.2"/>
      <text x="24" y="16.5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">v1.0</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="58" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#8b949e" letter-spacing="-0.01em">
      LLM Token Consumption &amp; Cost Visualizer
    </text>
  </g>
</svg>
