<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Robot Mascot Byte Head -->
  <g transform="translate(10, 10)">
    <!-- Antenna -->
    <line x1="22" y1="3" x2="22" y2="10" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="22" cy="3" r="2.5" fill="#38bdf8" filter="url(#eyeGlow)"/>

    <!-- Left & Right Ear Bolts -->
    <rect x="3" y="19" width="3" height="8" rx="1.5" fill="#30363d"/>
    <rect x="38" y="19" width="3" height="8" rx="1.5" fill="#30363d"/>

    <!-- Head Box -->
    <rect x="6" y="10" width="32" height="26" rx="7" fill="#1c2128" stroke="#38bdf8" stroke-width="2.2"/>

    <!-- Glowing Eyes (Emerald Cache Hit) -->
    <circle cx="16" cy="21" r="3.2" fill="#10b981" filter="url(#eyeGlow)"/>
    <circle cx="28" cy="21" r="3.2" fill="#10b981" filter="url(#eyeGlow)"/>

    <!-- Mouth -->
    <path d="M 16 28 Q 22 32 28 28" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
