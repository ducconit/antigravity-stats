<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Ambient Glow Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="220" cy="200" r="380" fill="url(#cyanGlow)"/>
  <circle cx="1020" cy="460" r="420" fill="url(#emeraldGlow)"/>

  <!-- Left Side: Branding & Headlines -->
  <g transform="translate(80, 95)">
    <!-- Pill Badge -->
    <rect width="230" height="34" rx="17" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="4" fill="#10b981"/>
    <text x="36" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">ANTIGRAVITY TELEMETRY</text>

    <!-- Mascot Icon & Title -->
    <g transform="translate(0, 55)">
      <!-- Robot Mascot Container -->
      <rect width="64" height="64" rx="18" fill="#161b22" stroke="url(#accentGrad)" stroke-width="2" filter="url(#softGlow)"/>
      <g transform="translate(14, 12)">
        <line x1="18" y1="2" x2="18" y2="8" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="18" cy="2" r="2.5" fill="#38bdf8"/>
        <rect x="2" y="16" width="3" height="8" rx="1.5" fill="#30363d"/>
        <rect x="31" y="16" width="3" height="8" rx="1.5" fill="#30363d"/>
        <rect x="5" y="8" width="26" height="23" rx="6" fill="#1c2128" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="13" cy="17" r="2.8" fill="#10b981"/>
        <circle cx="23" cy="17" r="2.8" fill="#10b981"/>
        <path d="M 13 23 Q 18 27 23 23" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      </g>

      <text x="82" y="46" font-family="'Inter', system-ui, sans-serif" font-size="42" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.03em">
        Antigravity Stats
      </text>
      <rect x="445" y="21" width="50" height="26" rx="13" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.2"/>
      <text x="470" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">v1.0</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="185" font-family="'Inter', system-ui, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">
      Token &amp; Cost Visualizer
    </text>

    <!-- Subtitle -->
    <text x="0" y="228" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="500" fill="#8b949e">
      Phân tích Token, Theo dõi Context Cache &amp; Waterfall Steps
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 268)">
      <!-- Go -->
      <rect x="0" y="0" width="92" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="46" y="20" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#00add8" text-anchor="middle">Golang</text>

      <!-- Vue 3 -->
      <rect x="102" y="0" width="85" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="144.5" y="20" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#42b883" text-anchor="middle">Vue 3</text>

      <!-- Tailwind v4 -->
      <rect x="197" y="0" width="124" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="259" y="20" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Tailwind v4</text>

      <!-- Pure SQLite -->
      <rect x="331" y="0" width="120" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="391" y="20" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">Pure SQLite</text>

      <!-- GitHub Pages -->
      <rect x="461" y="0" width="130" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="526" y="20" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">GitHub Pages</text>
    </g>

    <!-- Author Badge -->
    <g transform="translate(0, 350)">
      <rect width="280" height="44" rx="22" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
      <!-- GitHub Octocat Icon -->
      <path transform="translate(16, 12) scale(0.85)" fill="#f0f6fc" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      <text x="48" y="27" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">
        Phát triển bởi: <tspan fill="#38bdf8" font-weight="700">DNT</tspan> (@ducconit)
      </text>
    </g>
  </g>

  <!-- Right Side: Dark Dashboard UI Window Mockup -->
  <g transform="translate(710, 85)" filter="url(#cardShadow)">
    <rect width="430" height="460" rx="20" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <g transform="translate(20, 20)">
      <circle cx="6" cy="6" r="5" fill="#ef4444"/>
      <circle cx="22" cy="6" r="5" fill="#f59e0b"/>
      <circle cx="38" cy="6" r="5" fill="#10b981"/>
      <rect x="70" y="-1" width="220" height="16" rx="8" fill="#21262d"/>
      <text x="180" y="11" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8b949e" text-anchor="middle">http://127.0.0.1:58763</text>
    </g>

    <!-- Mini KPI Cards -->
    <g transform="translate(20, 56)">
      <!-- KPI 1: Hit Tokens -->
      <rect width="122" height="74" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="10.5" fill="#8b949e">Cache Hit</text>
      <text x="12" y="47" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#10b981">1.65B</text>
      <text x="12" y="63" font-family="'Inter', sans-serif" font-size="9" fill="#38bdf8">Tái sử dụng đệm</text>

      <!-- KPI 2: Hit Rate -->
      <rect x="132" width="126" height="74" rx="12" fill="#0d1117" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
      <text x="144" y="22" font-family="'Inter', sans-serif" font-size="10.5" fill="#38bdf8">Tỷ lệ Hit</text>
      <text x="144" y="47" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">94.0%</text>
      <text x="144" y="63" font-family="'Inter', sans-serif" font-size="9" fill="#10b981">Tiết kiệm chi phí</text>

      <!-- KPI 3: Cost -->
      <rect x="268" width="122" height="74" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="280" y="22" font-family="'Inter', sans-serif" font-size="10.5" fill="#8b949e">Chi phí</text>
      <text x="280" y="47" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#f59e0b">$88.57</text>
      <text x="280" y="63" font-family="'Inter', sans-serif" font-size="9" fill="#8b949e">~2.2M VNĐ</text>
    </g>

    <!-- Mini Chart Preview (Daily Timeline Bars) -->
    <g transform="translate(20, 146)">
      <rect width="390" height="150" rx="14" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
      <text x="16" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f0f6fc">Dòng thời gian tiêu thụ Token (Daily)</text>
      <circle cx="290" cy="22" r="3.5" fill="#10b981"/>
      <text x="298" y="25" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8b949e">Hit</text>
      <circle cx="340" cy="22" r="3.5" fill="#f59e0b"/>
      <text x="348" y="25" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8b949e">New</text>

      <!-- Chart Bars -->
      <g transform="translate(20, 130) scale(1, -1)">
        <!-- Bar 1 -->
        <rect x="10" y="0" width="18" height="25" rx="3" fill="#10b981"/>
        <rect x="10" y="27" width="18" height="6" rx="2" fill="#f59e0b"/>
        <!-- Bar 2 -->
        <rect x="40" y="0" width="18" height="42" rx="3" fill="#10b981"/>
        <rect x="40" y="44" width="18" height="7" rx="2" fill="#f59e0b"/>
        <!-- Bar 3 -->
        <rect x="70" y="0" width="18" height="58" rx="3" fill="#10b981"/>
        <rect x="70" y="60" width="18" height="8" rx="2" fill="#f59e0b"/>
        <!-- Bar 4 -->
        <rect x="100" y="0" width="18" height="20" rx="3" fill="#10b981"/>
        <rect x="100" y="22" width="18" height="5" rx="2" fill="#f59e0b"/>
        <!-- Bar 5 -->
        <rect x="130" y="0" width="18" height="68" rx="3" fill="#10b981"/>
        <rect x="130" y="70" width="18" height="10" rx="2" fill="#f59e0b"/>
        <!-- Bar 6 -->
        <rect x="160" y="0" width="18" height="40" rx="3" fill="#10b981"/>
        <rect x="160" y="42" width="18" height="6" rx="2" fill="#f59e0b"/>
        <!-- Bar 7 -->
        <rect x="190" y="0" width="18" height="55" rx="3" fill="#10b981"/>
        <rect x="190" y="57" width="18" height="7" rx="2" fill="#f59e0b"/>
        <!-- Bar 8 -->
        <rect x="220" y="0" width="18" height="82" rx="3" fill="#10b981"/>
        <rect x="220" y="84" width="18" height="12" rx="2" fill="#f59e0b"/>
        <!-- Bar 9 -->
        <rect x="250" y="0" width="18" height="45" rx="3" fill="#10b981"/>
        <rect x="250" y="47" width="18" height="8" rx="2" fill="#f59e0b"/>
        <!-- Bar 10 -->
        <rect x="280" y="0" width="18" height="75" rx="3" fill="#10b981"/>
        <rect x="280" y="77" width="18" height="10" rx="2" fill="#f59e0b"/>
        <!-- Bar 11 -->
        <rect x="310" y="0" width="18" height="86" rx="3" fill="#10b981"/>
        <rect x="310" y="88" width="18" height="9" rx="2" fill="#f59e0b"/>
      </g>
    </g>

    <!-- Mini Sessions Row -->
    <g transform="translate(20, 312)">
      <rect width="390" height="126" rx="14" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
      <text x="16" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f0f6fc">Sessions Explorer (49 dự án)</text>

      <!-- Session Item 1 -->
      <g transform="translate(16, 36)">
        <rect width="358" height="38" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="12" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f0f6fc">agent-pilot-extension</text>
        <rect x="260" y="9" width="46" height="20" rx="4" fill="rgba(16,185,129,0.15)"/>
        <text x="283" y="23" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">94.3%</text>
        <text x="345" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#f0f6fc" text-anchor="end">$52.95</text>
      </g>

      <!-- Session Item 2 -->
      <g transform="translate(16, 78)">
        <rect width="358" height="38" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="12" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f0f6fc">antigravity-stats</text>
        <rect x="260" y="9" width="46" height="20" rx="4" fill="rgba(56,189,248,0.15)"/>
        <text x="283" y="23" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">93.8%</text>
        <text x="345" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#f0f6fc" text-anchor="end">$35.25</text>
      </g>
    </g>
  </g>
</svg>
